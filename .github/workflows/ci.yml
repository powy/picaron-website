# Checks run on every pull request and on main. No secrets, no hosting
# provider: everything runs offline (mock payment, mock relay picker, local
# Postgres), like `npm run test:e2e` on a laptop.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Weekly run so newly published advisories show up even without commits.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Lint, types, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - name: Build the Scaleway function bundle
        run: npm run build:functions

  e2e:
    name: Integration and e2e tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      # Same image and port as infra/local/docker-compose.yml.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: picaron
          POSTGRES_PASSWORD: picaron
          POSTGRES_DB: picaron_commandes
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U picaron -d picaron_commandes"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
      # Catches the confirmation emails, which the e2e tests then check.
      mailpit:
        image: axllent/mailpit:v1.32.0
        ports:
          - 1025:1025
          - 8025:8025
    env:
      DATABASE_URL: postgres://picaron:picaron@localhost:5433/picaron_commandes
      E2E_MAILPIT: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:setup
      - run: npm run test:integration
      - run: npx playwright install --with-deps chromium
      # Builds the production bundle itself (playwright.config.ts webServer).
      - run: npm run test:e2e
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  terraform:
    name: Terraform fmt and validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      - run: terraform fmt -check -recursive
      # No backend and no credentials: checks the configuration only.
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  security:
    name: Dependency audit and secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: npm audit (production dependencies, high and above)
        run: npm audit --omit=dev --audit-level=high
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          # Same version as scripts/ci-local.mjs; .gitleaks.toml is read from the repo root.
          GITLEAKS_VERSION: 8.30.1
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
