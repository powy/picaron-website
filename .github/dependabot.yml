# Weekly grouped update PRs; each one goes through CI like any other PR.
# At most one npm PR for minor/patch updates (queued automatically by
# Mergify) and one for major updates (needs a review), never one per package.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
      major:
        update-types: [major]
    ignore:
      # Matches the Node version of .nvmrc; bump both together.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
      # typescript-eslint supports TypeScript < 6.1 only; drop this rule
      # once it supports TypeScript 7.
      - dependency-name: 'typescript'
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: terraform
    directory: /infra/terraform
    schedule:
      interval: weekly
    groups:
      terraform:
        patterns: ['*']
